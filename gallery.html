  <script>
    document.querySelectorAll('.gallery-filter').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var f = btn.getAttribute('data-filter');
        document.querySelectorAll('.gallery-filter').forEach(function (b) { b.classList.toggle('active', b === btn); });
        document.querySelectorAll('.gallery-item').forEach(function (it) {
          it.classList.toggle('hidden', f !== 'all' && it.getAttribute('data-region') !== f);
        });
      });
    });
